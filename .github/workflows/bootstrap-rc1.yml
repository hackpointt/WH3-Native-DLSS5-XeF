name: Bootstrap WH3 Native DLSS5 XeFG RC1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-rc1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated RC1 package
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/WH3-Native-DLSS5-XeFG-RC1-v15.zip \
            https://github.com/hackpointt/RTS-Tactical-Overlay/releases/download/v0.1.0-rc1/WH3-Native-DLSS5-XeFG-RC1-v15.zip
          echo 'e2b21db84e242a4db218b28b9cdc97899b6c711f9315795d75fb31f85fcc6403  /tmp/WH3-Native-DLSS5-XeFG-RC1-v15.zip' | sha256sum -c -
          rm -rf /tmp/wh3-rc1
          mkdir -p /tmp/wh3-rc1
          unzip -q /tmp/WH3-Native-DLSS5-XeFG-RC1-v15.zip -d /tmp/wh3-rc1
          test -f /tmp/wh3-rc1/WH3-Native-DLSS5-XeFG-RC1-v15/source/WH3-native-DLSS5-XeFG.patch
          test -f /tmp/wh3-rc1/WH3-Native-DLSS5-XeFG-RC1-v15/docs/four-green-status.png

      - name: Populate clean project repository
        run: |
          set -euo pipefail
          SRC=/tmp/wh3-rc1/WH3-Native-DLSS5-XeFG-RC1-v15

          rm -rf config source tools docs
          cp -R "$SRC/config" ./config
          cp -R "$SRC/source" ./source
          cp -R "$SRC/tools" ./tools
          cp -R "$SRC/docs" ./docs
          cp "$SRC/README.md" ./README.md
          cp "$SRC/README.zh-CN.md" ./README.zh-CN.md
          cp "$SRC/BUILD_INFO.json" ./BUILD_INFO.json
          cp "$SRC/VERSION.txt" ./VERSION.txt

          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('# Total War: WARHAMMER III — Native DLSS5 → XeFG RC1', '# Total War: WARHAMMER III — Native DLSS5 → XeFG')
          prefix = '[中文说明](README.zh-CN.md) · [Download RC1](https://github.com/hackpointt/WH3-Native-DLSS5-XeF/releases/tag/v0.1.0-rc1)\n\n'
          if prefix not in s:
              s = s.replace('\n\n', '\n\n' + prefix, 1)
          s = s.replace('See `docs/four-green-status.png` for the expected result.', '![Expected four-green status](docs/four-green-status.png)')
          p.write_text(s, encoding='utf-8')

          p = Path('README.zh-CN.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('# Total War: WARHAMMER III — Native DLSS5 → XeFG RC1', '# Total War: WARHAMMER III — Native DLSS5 → XeFG')
          prefix = '[English](README.md) · [下载 RC1](https://github.com/hackpointt/WH3-Native-DLSS5-XeF/releases/tag/v0.1.0-rc1)\n\n'
          if prefix not in s:
              s = s.replace('\n\n', '\n\n' + prefix, 1)
          s = s.replace('示例见 `docs/four-green-status.png`。', '![四绿状态示例](docs/four-green-status.png)')
          p.write_text(s, encoding='utf-8')
          PY

          cat > .gitignore <<'EOF'
          dist/
          *.log
          *.bak
          EOF

      - name: Commit project files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md BUILD_INFO.json VERSION.txt .gitignore config source tools docs
          if ! git diff --cached --quiet; then
            git commit -m 'Publish WH3 Native DLSS5 XeFG RC1 project files'
            git push origin HEAD:main
          fi
          echo "TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish RC1 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.1.0-rc1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          cp /tmp/WH3-Native-DLSS5-XeFG-RC1-v15.zip ./WH3-Native-DLSS5-XeFG-RC1-v15.zip
          sha256sum WH3-Native-DLSS5-XeFG-RC1-v15.zip > WH3-Native-DLSS5-XeFG-RC1-v15.zip.sha256
          cp source/WH3-native-DLSS5-XeFG.patch ./WH3-native-DLSS5-XeFG.patch

          gh release create "$TAG" \
            --target "$TARGET" \
            --title 'WH3 Native DLSS5 → XeFG RC1 (V15)' \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease \
            WH3-Native-DLSS5-XeFG-RC1-v15.zip \
            WH3-Native-DLSS5-XeFG-RC1-v15.zip.sha256 \
            WH3-native-DLSS5-XeFG.patch

          gh release view "$TAG"
