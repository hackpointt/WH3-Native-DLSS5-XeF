name: Build V16 ReShade tuning mode

on:
  push:
    branches:
      - reshade-overlay-fix
    paths:
      - '.github/workflows/build-v16-reshade-tuning.yml'
      - 'experiments/v16/**'
      - 'source/WH3-native-DLSS5-XeFG.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build V16 experiment
        shell: powershell
        run: .\experiments\v16\build.ps1

      - name: Upload V16 experiment
        uses: actions/upload-artifact@v4
        with:
          name: WH3-DLSS5-XeFG-V16-ReShade-Tuning
          path: package
          if-no-files-found: error
